services:
  - type: web
    name: crypto-bot
    runtime: python
    plan: free
    branch: main
    rootDir: backend
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SIMULATION_BOT_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: API_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: KEEPALIVE_URL
        sync: false
